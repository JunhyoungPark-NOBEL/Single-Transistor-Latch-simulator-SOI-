# STL simulator — lab-server stack (guide: docs/DEPLOY_LAB.md)
#
#   app          the simulator, built from the repository Dockerfile. NOT published on the host: only the proxy (and
#                the tunnel containers) can reach it, over the internal network "backend".
#   caddy        HTTPS reverse proxy on ports 80/443: Let's Encrypt for a real DNS name (STL_TLS_MODE=acme) or its
#                own local CA for a campus-only name / IP address (STL_TLS_MODE=internal).
#   debug        profile "debug": 127.0.0.1-only port straight to the app, for troubleshooting on the server itself.
#   cloudflared  profile "cloudflare": Cloudflare Tunnel — reach the site from outside the campus firewall without
#                opening any inbound port.
#   tailscale    profile "tailscale": Tailscale Funnel — same idea, https://<name>.<tailnet>.ts.net
#
# PINNED ON THE SERVER: install.sh copies this file, the Caddyfile and tailscale-funnel.json into the root-owned
# $STL_HOME/kit/ (default /opt/stl-sim/kit), and the updater only ever runs that copy. A push that changes them does
# NOT change the server: the updater logs "kit changed", and the owner reviews the diff and re-runs install.sh.
# (Whoever can change this file controls the host — the service user is in the docker group — so it must never be
# taken from a pushed commit automatically.)
#
# Every ${VARIABLE} comes from $STL_HOME/stl.env (copy of stl.env.example; never committed), except
# STL_BUILD_CONTEXT and STL_IMAGE_TAG, which the updater sets per call. By hand, on the server:
#     sudo stl-lab --compose ps              sudo stl-lab --compose logs -f app
# `stl-lab --compose config` prints the password: do not paste its output anywhere.
#
# The image tag is interpolated so the updater can switch and roll back: it builds ${STL_IMAGE}:<commit>, then points
# ${STL_IMAGE}:live at the image that should run (`docker compose up -d` always runs :live unless STL_IMAGE_TAG is set).

name: ${STL_PROJECT:-stl}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build:
      # the clean build worktree of the commit being deployed (absolute path, set by the updater)
      context: ${STL_BUILD_CONTEXT:?set by deploy/lab/update.sh}
      dockerfile: Dockerfile
      args:
        # a uid/gid no account on the host has: the app's processes belong to this host uid (no userns remapping)
        APP_UID: ${STL_APP_UID:-61000}
    image: ${STL_IMAGE:-stl-lab/app}:${STL_IMAGE_TAG:-live}
    # never pulled or built by `up`: only the updater builds (and checks) images
    pull_policy: never
    user: "${STL_APP_UID:-61000}:${STL_APP_UID:-61000}"
    restart: unless-stopped
    init: true
    environment:
      # login gate (server/auth.py): link + password. Fail closed: with an empty password every request, the health
      # check included, answers 503 — the container never turns healthy and the updater keeps the previous version.
      STL_ACCESS_PASSWORD: ${STL_ACCESS_PASSWORD:-}
      STL_SESSION_SECRET: ${STL_SESSION_SECRET:-}
      STL_REQUIRE_PASSWORD: "1"
      # every request comes through caddy (or a tunnel container) on the internal network: the login limiter keys on
      # the address caddy puts in X-Forwarded-For, and uvicorn trusts forwarded headers only from that network
      STL_TRUST_PROXY: "1"
      FORWARDED_ALLOW_IPS: ${STL_NET_SUBNET:-172.30.83.0/24}
      # compute processes (~200 MB each); empty = CPUs − 1
      STL_WORKERS: ${STL_WORKERS:-}
      # request body limit, the same value in the proxy (Caddyfile)
      STL_MAX_BODY_KB: ${STL_MAX_BODY_KB:-256}
    volumes:
      # result cache, keyed by the engine/server code hash, so it stays valid across deploys. The numba and
      # stochastic-node caches are compiled into each image at build time (scripts/warmup.py) and are not shared.
      - results:/app/server/.cache/results
    networks:
      - backend
    # no "ports:" on purpose: the app is reachable only through the proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request as u; d=json.load(u.urlopen('http://127.0.0.1:8000/api/health', timeout=4)); raise SystemExit(0 if d.get('ok') and d.get('access_gate') == 'on' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
      start_interval: 3s
    stop_grace_period: 30s
    mem_limit: ${STL_MEM_LIMIT:-4g}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging

  caddy:
    image: ${STL_CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on:
      - app
    environment:
      STL_SITE_ADDRESS: ${STL_SITE_ADDRESS:-localhost}
      STL_TLS_MODE: ${STL_TLS_MODE:-internal}
      STL_NET_SUBNET: ${STL_NET_SUBNET:-172.30.83.0/24}
      STL_MAX_BODY_KB: ${STL_MAX_BODY_KB:-256}
    ports:
      - "${STL_BIND_ADDR:-0.0.0.0}:${STL_HTTP_PORT:-80}:80"
      - "${STL_BIND_ADDR:-0.0.0.0}:${STL_HTTPS_PORT:-443}:443"
      - "${STL_BIND_ADDR:-0.0.0.0}:${STL_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # certificates and, with STL_TLS_MODE=internal, the private key of Caddy's local CA: keep this volume, and treat
      # a backup of it like a password (docs/DEPLOY_LAB.md §4B)
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
      - edge
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging: *logging

  debug:
    profiles: ["debug"]
    image: ${STL_CADDY_IMAGE:-caddy:2-alpine}
    command: ["caddy", "reverse-proxy", "--from", ":8000", "--to", "app:8000"]
    depends_on:
      - app
    ports:
      - "127.0.0.1:${STL_DEBUG_PORT:-8000}:8000"
    networks:
      - backend
      - edge
    read_only: true
    tmpfs:
      - /tmp
      - /data
      - /config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # the caddy binary carries this file capability; exec fails without it
    logging: *logging

  cloudflared:
    profiles: ["cloudflare"]
    image: ${STL_CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # Cloudflare Zero Trust → Networks → Tunnels → (tunnel) → token. Public hostname service: http://caddy:8080
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    networks:
      - backend
      - tunnel
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging

  tailscale:
    profiles: ["tailscale"]
    image: ${STL_TAILSCALE_IMAGE:-tailscale/tailscale:stable}
    hostname: ${TS_HOSTNAME:-stl-sim}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-stl-sim}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/funnel.json
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale-funnel.json:/config/funnel.json:ro
    depends_on:
      - caddy
    networks:
      - backend
      - tunnel
    security_opt:
      - no-new-privileges:true
    logging: *logging

networks:
  # app ↔ caddy (↔ tunnel containers). internal: no route to the outside world. inhibit_ipv4: the host gets no address
  # on this bridge, so users logged in on the server cannot open a connection to the app (only through caddy). The
  # fixed subnet is what the app trusts for X-Forwarded-For; change STL_NET_SUBNET only if it collides with another
  # network on the server.
  backend:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: ${STL_NET_SUBNET:-172.30.83.0/24}
  # published ports of caddy / debug, and Let's Encrypt
  edge: {}
  # outbound connections of the tunnel containers (kept apart from "edge" so they reach caddy only via "backend")
  tunnel: {}

volumes:
  results:
  caddy_data:
  caddy_config:
  tailscale_state:
